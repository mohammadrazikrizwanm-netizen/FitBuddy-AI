<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        FitBuddy
        {% endblock %}
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>


<body>

<header class="nav">

    <a
        class="brand"
        href="/"
    >
        Fit<span>Buddy</span>
    </a>

    <a
        class="nav-link"
        href="/view-all-users"
    >
        Admin
    </a>

</header>


<main>

    {% block content %}

    {% endblock %}

</main>


<footer>

    FitBuddy • AI Fitness Plan Generator

</footer>

<script
    src="{{ url_for('static', path='js/light-rays.js') }}"
    defer
></script>

</body>

</html>
